function setExportFormat(fmt) {
  exportFormat = fmt;
  document.querySelectorAll('#format-tabs .fmt-tab').forEach(b => b.classList.toggle('active', b.dataset.fmt === fmt));
  document.getElementById('json-pane').style.display = fmt === 'json' ? '' : 'none';
  document.getElementById('image-pane').style.display = fmt === 'image' ? '' : 'none';
  document.getElementById('modal-options').style.display = fmt === 'json' ? 'flex' : 'none';
  document.getElementById('modal-copy').style.display = fmt === 'json' ? '' : 'none';
  const action = document.getElementById('modal-action');
  action.textContent = fmt === 'image' ? t('download') : t('copy');
  // Auto-render preview when switching to image
  if (fmt === 'image') {
    _lastCapture = null;
    refreshImagePreview(exportImageVp);
  }
}

/* Last captured canvas (kept around so Download reuses the previewed canvas
   instead of re-capturing). Cleared when viewport changes. */
let _lastCapture = null;  // { vp, canvas, date }

async function captureViewport(vp) {
  if (!window.html2canvas) {
    // wait briefly for CDN to finish loading
    for (let i = 0; i < 20 && !window.html2canvas; i++) await new Promise(r => setTimeout(r, 100));
  }
  if (!window.html2canvas) throw new Error('html2canvas not loaded — check internet connection');
  const originalWrapper = document.querySelector(`.viewport.vp-${vp}`);
  if (!originalWrapper) throw new Error('Viewport not found');

  // Clone the wrapper (so the .vp-desktop / .vp-tablet / .vp-mobile class
  // context is preserved — CSS selectors target those classes for width/zoom).
  // Then move it far off-screen and override zoom so capture is at full
  // native resolution. Capture only the inner .vp-frame so we don't include
  // the label.
  const wrapperClone = originalWrapper.cloneNode(true);
  wrapperClone.classList.remove('hidden');                 // ensure visible
  wrapperClone.style.position = 'absolute';
  wrapperClone.style.top = '0';
  wrapperClone.style.left = '-100000px';
  wrapperClone.style.margin = '0';
  wrapperClone.style.display = 'flex';                     // force flex layout
  wrapperClone.style.opacity = '1';
  wrapperClone.style.pointerEvents = 'none';
  // Override zoom on the cloned .vp-frame inside the wrapper
  const cloneFrame = wrapperClone.querySelector('.vp-frame');
  cloneFrame.style.zoom = '1';
  // Drop the label so it's not in the capture
  const cloneLabel = wrapperClone.querySelector('.vp-label');
  if (cloneLabel) cloneLabel.remove();

  document.body.appendChild(wrapperClone);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  // Watermark on the cloned frame
  const wm = document.createElement('div');
  wm.style.cssText = 'position:absolute;bottom:10px;right:14px;background:rgba(0,0,0,0.65);color:#fff;font:11px/1.4 monospace;padding:4px 9px;border-radius:3px;z-index:9999;letter-spacing:0.5px;';
  const date = new Date().toISOString().slice(0,10);
  wm.textContent = `NGG Layout · ${vp.toUpperCase()} · ${date}`;
  cloneFrame.appendChild(wm);

  try {
    if (cloneFrame.scrollWidth === 0 || cloneFrame.scrollHeight === 0) {
      throw new Error('Cloned viewport has 0 size — layout may be empty');
    }
    const canvas = await html2canvas(cloneFrame, {
      backgroundColor: '#ffffff',
      scale: 1,
      logging: false,
      useCORS: true,
      windowWidth: cloneFrame.scrollWidth,
      windowHeight: cloneFrame.scrollHeight,
      width: cloneFrame.scrollWidth,
      height: cloneFrame.scrollHeight,
    });
    return { canvas, date };
  } finally {
    wrapperClone.remove();
  }
}

async function refreshImagePreview(vp) {
  const prev = document.getElementById('image-preview');
  if (!prev) return;
  prev.innerHTML = `<div style="font-size:12px;color:var(--text-muted);text-align:center;line-height:1.6;">⏳ Capturing ${vp}...</div>`;
  try {
    const { canvas, date } = await captureViewport(vp);
    _lastCapture = { vp, canvas, date };
    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);  // lower quality for preview
    prev.innerHTML = `
      <div style="text-align:center;width:100%;">
        <img src="${dataUrl}" style="max-width:100%;max-height:380px;height:auto;border:1px solid var(--border);border-radius:4px;display:block;margin:0 auto;">
        <div style="font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text-subtle);margin-top:8px;">
          ${canvas.width} × ${canvas.height} px · JPG 92% · with watermark
        </div>
      </div>`;
  } catch (e) {
    console.error(e);
    _lastCapture = null;
    prev.innerHTML = `<div style="font-size:12px;color:var(--brand);text-align:center;line-height:1.6;">⚠ Capture failed<br><span style="font-size:11px;color:var(--text-muted);">${escapeHtml(e.message)}</span></div>`;
  }
}

async function exportImage(vp) {
  // Reuse cached canvas if it matches the requested viewport
  let cap = _lastCapture && _lastCapture.vp === vp ? _lastCapture : null;
  if (!cap) {
    try { cap = await captureViewport(vp); _lastCapture = { vp, ...cap }; }
    catch (e) { toast(e.message, 'error'); return; }
  }
  cap.canvas.toBlob(blob => {
    if (!blob) { toast('Failed to encode image', 'error'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ngg-layout-${cap.vp}-${cap.date}.jpg`;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    // Defer cleanup so the browser has time to start the download
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
    toast(t('toast_image_exported'), 'success');
  }, 'image/jpeg', 0.92);
}

function updateExportText() {
  const includeImages = document.getElementById('opt-include-images').checked;
  const data = {
    version: '1.0',
    project: 'NGG Homepage',
    exportedAt: new Date().toISOString(),
    layout: state.layout.map((inst, i) => {
      const def = SECTIONS[inst.sectionId];
      return {
        order: i + 1,
        sectionId: inst.sectionId,
        name: def.name.en,
        note: inst.note || '',
        texts: inst.texts && Object.keys(inst.texts).length ? Object.assign({}, inst.texts) : undefined,
        images: (def.images || []).map((spec, k) => {
          const slot = normalizeImageSlot(inst.images[k]);
          const effSpec = getImageSpec(inst, k);
          const out = {
            name: spec.name,
            w: effSpec.w,
            h: effSpec.h,
            baseW: spec.w,
            baseH: spec.h,
            format: spec.format,
            customRatio: !!(slot.customW && slot.customH),
            variants: {
              desktop: !!slot.desktop,
              tablet:  !!slot.tablet,
              mobile:  !!slot.mobile,
            }
          };
          if (includeImages) {
            out.uploads = {};
            ['desktop','tablet','mobile'].forEach(d => {
              if (slot[d]) out.uploads[d] = slot[d];
            });
          }
          return out;
        })
      };
    })
  };
  document.getElementById('modal-textarea').value = JSON.stringify(data, null, 2);
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  modalMode = null;
  _lastCapture = null;
}

/* ============================================================
   IMPORT / EXPORT
   ============================================================ */
function applyImport() {
  const ta = document.getElementById('modal-textarea');
  try {
    const data = JSON.parse(ta.value);
    if (!data.layout || !Array.isArray(data.layout)) throw new Error('invalid');
    const newLayout = [];
    data.layout.forEach(item => {
      const def = SECTIONS[item.sectionId];
      if (!def) return;
      const inst = makeInstance(item.sectionId);
      inst.note = item.note || '';
      if (item.texts && typeof item.texts === 'object') inst.texts = Object.assign({}, item.texts);
      if (Array.isArray(item.images)) {
        item.images.forEach((im, k) => {
          if (k >= inst.images.length) return;
          const slot = makeImageSlot();
          if (im && im.uploads) {
            ['desktop','tablet','mobile'].forEach(d => {
              if (im.uploads[d] && im.uploads[d].dataUrl) slot[d] = im.uploads[d];
            });
          } else if (im && im.dataUrl) {
            slot.desktop = { dataUrl: im.dataUrl, w: im.uploadedW || im.w, h: im.uploadedH || im.h };
          }
          if (im && im.customRatio && im.w && im.h && im.baseW && im.baseH && (im.w !== im.baseW || im.h !== im.baseH)) {
            slot.customW = im.w; slot.customH = im.h;
          }
          inst.images[k] = slot;
        });
      }
      newLayout.push(inst);
    });
    if (newLayout.length === 0) throw new Error('empty');
    pushHistory();
    state.layout = newLayout;
    state.selectedId = null;
    render();
    closeModal();
    toast(t('toast_imported'), 'success');
  } catch (e) {
    toast(t('toast_invalid'), 'error');
  }
}

function copyExport() {
  const ta = document.getElementById('modal-textarea');
  ta.select();
  try {
    navigator.clipboard.writeText(ta.value);
    toast(t('toast_exported'), 'success');
  } catch (e) {
    document.execCommand('copy');
    toast(t('toast_exported'), 'success');
  }
}

/* ============================================================
   WELCOME / TEMPLATE PICKER
   ============================================================ */
function openWelcome() {
  state.welcomePT = state.pageType || 'homepage';
  document.getElementById('welcome-modal').classList.add('active');
  // show "Save current" button only when there's something to save
  document.getElementById('welcome-save-current').style.display =
    state.layout.length > 0 ? '' : 'none';
  renderWelcome();
}
function closeWelcome() { document.getElementById('welcome-modal').classList.remove('active'); }

function renderWelcome() {
  // active tab styling
  document.querySelectorAll('.welcome-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.pt === state.welcomePT));
  const body = document.getElementById('welcome-body');
  const pt = state.welcomePT;

  let cards = '';
  const list = TEMPLATES[pt] || [];
  cards += `<div class="tmpl-grid">` +
    list.map(t => templateCard(t, pt)).join('') +
    `</div>`;

  if (pt === 'custom') {
    const custom = getCustomTemplates();
    cards += `<div style="margin-top:24px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);">${t('custom_templates')}</div>`;
    if (custom.length === 0) {
      cards += `<div style="margin-top:10px;font-size:12px;color:var(--text-subtle);padding:14px;background:var(--panel-2);border-radius:6px;text-align:center;">${t('no_custom')}</div>`;
    } else {
      cards += `<div class="tmpl-grid" style="margin-top:10px;">` +
        custom.map(c => templateCard(c, c.pageType || 'custom', true)).join('') + `</div>`;
    }
  }

  body.innerHTML = cards;

  body.querySelectorAll('.tmpl-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.tmpl-card-delete')) return;
      const tid = card.dataset.tid;
      const ptype = card.dataset.pt;
      applyTemplate(tid, ptype);
    });
  });
  body.querySelectorAll('.tmpl-card-delete').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const tid = btn.dataset.tid;
      deleteCustomTemplate(tid);
      renderWelcome();
      toast(t('template_deleted'));
    });
  });
}

function templateCard(tmpl, ptype, isCustom = false) {
  const count = (tmpl.sections || []).length;
  return `<div class="tmpl-card" data-tid="${tmpl.id}" data-pt="${ptype}">
    <div class="tmpl-card-preview">${templatePreview(tmpl.sections || [])}</div>
    <div class="tmpl-card-body">
      <div class="tmpl-card-name">${escapeHtml(tmpl.name[state.lang] || tmpl.name.en)}</div>
      <div class="tmpl-card-desc">${escapeHtml(tmpl.desc[state.lang] || tmpl.desc.en || '')}</div>
      <div class="tmpl-card-meta">
        <span class="tmpl-card-count">${count} ${count===1?'section':'sections'}</span>
        ${isCustom ? `<button class="tmpl-card-delete" data-tid="${tmpl.id}" title="Delete">✕</button>` : ''}
      </div>
    </div>
  </div>`;
}

function findTemplate(id) {
  const customs = getCustomTemplates();
  for (const c of customs) if (c.id === id) return { tmpl: c, pt: c.pageType || 'custom', isCustom: true };
  for (const cat of ['homepage','landing','custom']) {
    for (const t of (TEMPLATES[cat] || [])) if (t.id === id) return { tmpl: t, pt: cat, isCustom: false };
  }
  return null;
}

function applyTemplate(id, ptype) {
  const found = findTemplate(id);
  if (!found) return;
  if (state.layout.length > 0 && !confirm(t('confirm_apply'))) return;
  pushHistory();
  state.layout = (found.tmpl.sections || []).map(sid => makeInstance(sid)).filter(Boolean);
  state.selectedId = null;
  // Set page type — 'custom' template + blank stays as 'custom'
  state.pageType = ptype === 'custom' ? (found.tmpl.sections.length === 0 ? 'custom' : (found.tmpl.pageType || 'custom')) : ptype;
  closeWelcome();
  render();
  toast(t('template_applied'), 'success');
}

function saveCurrentAsTemplate() {
  const name = prompt(t('template_name_prompt'), '');
  if (!name) return;
  const sections = state.layout.map(x => x.sectionId);
  saveCustomTemplate(name.trim(), sections, state.pageType || 'custom');
  toast(t('template_saved'), 'success');
  state.welcomePT = 'custom';
  renderWelcome();
}

/* ============================================================
   RESET
   ============================================================ */
function resetLayout() {
  if (!confirm(t('confirm_reset'))) return;
  pushHistory();
  state.layout = NGG_DEFAULT.map(id => makeInstance(id));
  state.selectedId = null;
  render();
  toast(t('toast_reset'));
}

/* ============================================================
   EVENT BINDINGS
   ============================================================ */
function bindEvents() {
  // language
  document.querySelectorAll('[data-lang-set]').forEach(b => b.addEventListener('click', () => {
    state.lang = b.dataset.langSet; render();
  }));
  // theme
  document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => {
    state.theme = b.dataset.themeSet; render();
  }));
  // library tabs
  document.querySelectorAll('.lib-tab').forEach(b => b.addEventListener('click', () => {
    state.cat = b.dataset.cat; render();
  }));
  // viewport tabs
  document.querySelectorAll('.vp-tab').forEach(b => b.addEventListener('click', () => {
    state.vp = b.dataset.vp; render();
  }));
  // search
  document.getElementById('lib-search-input').addEventListener('input', e => {
    state.search = e.target.value; renderLibrary();
  });
  // topbar
  document.getElementById('btn-reset').addEventListener('click', resetLayout);
  document.getElementById('btn-new').addEventListener('click', openWelcome);
  document.getElementById('welcome-close').addEventListener('click', closeWelcome);
  document.getElementById('welcome-modal').addEventListener('click', e => {
    if (e.target.id === 'welcome-modal') closeWelcome();
  });
  document.querySelectorAll('.welcome-tab').forEach(b => b.addEventListener('click', () => {
    state.welcomePT = b.dataset.pt;
    renderWelcome();
  }));
  document.getElementById('welcome-save-current').addEventListener('click', saveCurrentAsTemplate);
  document.getElementById('pt-filter-toggle').addEventListener('change', e => {
    state.ptFilter = e.target.checked;
    renderLibrary();
  });
  document.getElementById('btn-export').addEventListener('click', () => openModal('export'));
  document.getElementById('btn-import').addEventListener('click', () => openModal('import'));
  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-redo').addEventListener('click', redo);
  document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(state.zoom + 0.1));
  document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(state.zoom - 0.1));
  document.getElementById('btn-zoom-reset').addEventListener('click', () => setZoom(1));

  /* spacebar pan */
  const scroll = document.getElementById('canvas-scroll');
  let panStart = null;
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      const tag = document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement.isContentEditable) return;
      if (!document.body.classList.contains('space-down')) {
        document.body.classList.add('space-down');
      }
      e.preventDefault();
    }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'Space') {
      document.body.classList.remove('space-down');
      document.body.classList.remove('panning');
      panStart = null;
    }
  });
  scroll.addEventListener('mousedown', e => {
    if (!document.body.classList.contains('space-down')) return;
    e.preventDefault();
    document.body.classList.add('panning');
    panStart = { x: e.clientX, y: e.clientY, sl: scroll.scrollLeft, st: scroll.scrollTop };
  });
  document.addEventListener('mousemove', e => {
    if (!panStart) return;
    scroll.scrollLeft = panStart.sl - (e.clientX - panStart.x);
    scroll.scrollTop  = panStart.st - (e.clientY - panStart.y);
  });
  document.addEventListener('mouseup', () => {
    document.body.classList.remove('panning');
    panStart = null;
  });
  /* Ctrl/Cmd + wheel zoom */
  scroll.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      setZoom(state.zoom + delta);
    }
  }, { passive: false });
  // modal
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') closeModal();
  });
  document.getElementById('modal-action').addEventListener('click', () => {
    if (modalMode === 'export') {
      if (exportFormat === 'image') exportImage(exportImageVp);
      else copyExport();
    } else {
      applyImport();
    }
  });
  document.querySelectorAll('#format-tabs .fmt-tab').forEach(b => {
    b.addEventListener('click', () => setExportFormat(b.dataset.fmt));
  });
  document.querySelectorAll('#img-vp-tabs .vp-tab').forEach(b => {
    b.addEventListener('click', () => {
      exportImageVp = b.dataset.imgvp;
      document.querySelectorAll('#img-vp-tabs .vp-tab').forEach(x => x.classList.toggle('active', x === b));
      _lastCapture = null;
      refreshImagePreview(exportImageVp);
    });
  });
  document.getElementById('modal-copy').addEventListener('click', () => {
    document.getElementById('modal-textarea').select();
    document.execCommand('copy');
    toast(t('toast_exported'));
  });
  document.getElementById('opt-include-images').addEventListener('change', updateExportText);

  // keyboard
  document.addEventListener('keydown', e => {
    const isInput = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
    if (isInput) return;
    if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((e.metaKey || e.ctrlKey) && (e.key === 'Z' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    else if ((e.metaKey || e.ctrlKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); setZoom(state.zoom + 0.1); }
    else if ((e.metaKey || e.ctrlKey) && e.key === '-') { e.preventDefault(); setZoom(state.zoom - 0.1); }
    else if ((e.metaKey || e.ctrlKey) && e.key === '0') { e.preventDefault(); setZoom(1); }
    else if ((e.metaKey || e.ctrlKey) && e.key === 'd') {
      e.preventDefault();
      const inst = state.layout.find(x => x.id === state.selectedId);
      if (inst) {
        const idx = state.layout.indexOf(inst);
        pushHistory();
        const copy = JSON.parse(JSON.stringify(inst));
        copy.id = nextId();
        state.layout.splice(idx+1, 0, copy);
        state.selectedId = copy.id;
        render(); toast(t('toast_duplicated'));
      }
    }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedId) {
      e.preventDefault();
      const idx = state.layout.findIndex(x => x.id === state.selectedId);
      if (idx >= 0) {
        pushHistory();
        state.layout.splice(idx, 1);
        state.selectedId = null;
        render(); toast(t('toast_removed'));
      }
    }
    else if (e.key === 'Escape') {
      closeModal();
      closeWelcome();
      state.selectedId = null;
      render();
    }
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  const restored = loadPersisted();
  bindEvents();
  setupDropZones();
  render();
  if (!restored) {
    // First-time visitor: show template picker. ESC or close starts blank-with-NGG.
    openWelcome();
  }
}

init();
</script>
